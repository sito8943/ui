# Config de pnpm para v11 (v11 ya no lee el campo "pnpm" de package.json).
# El campo en package.json se mantiene a proposito: pnpm 10 le da precedencia,
# asi que hoy nada cambia. Al pasar a pnpm 11 este archivo toma el relevo.
# Los valores DEBEN quedar identicos en ambos lados.

overrides:
  "@microsoft/api-extractor": 7.58.9
  ajv: 6.15.0
  brace-expansion: 1.1.16
  cross-spawn: 7.0.6
  flatted: 3.4.2
  lodash: 4.18.1
  minimatch: 3.1.5
  validator: 13.15.35
